version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: orchestrator_redis
    ports:
      - "6379:6379"
    restart: always

  task-orchestrator:
    build: .
    container_name: task_orchestrator
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - CONCURRENCY=8
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: always
